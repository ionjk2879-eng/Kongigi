<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>샘플 기프티콘</title>
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    }
    h2 { color: #555; font-size: 14px; margin-bottom: 16px; }
    .gifticon {
      width: 360px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12);
      overflow: hidden;
      margin-bottom: 24px;
    }
    .header {
      background: #006241;
      padding: 20px 24px;
      text-align: center;
    }
    .brand-en { color: white; font-size: 22px; font-weight: 700; letter-spacing: 3px; }
    .brand-ko { color: rgba(255,255,255,0.8); font-size: 12px; margin-top: 2px; }
    .body { padding: 20px 24px; }
    .product { font-size: 20px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .size { font-size: 14px; color: #888; margin-bottom: 16px; }
    .divider { border: none; border-top: 1px dashed #ddd; margin: 16px 0; }
    .expiry-label { font-size: 11px; color: #aaa; text-transform: uppercase; letter-spacing: 1px; }
    .expiry-value { font-size: 15px; color: #333; font-weight: 500; margin-top: 2px; }
    .barcode-wrap { text-align: center; padding: 16px 0 8px; }
    svg#barcode { max-width: 100%; }
  </style>
</head>
<body>
  <h2>아래 기프티콘을 스크린샷으로 저장 후 앱에서 테스트하세요</h2>

  <div class="gifticon">
    <div class="header">
      <div class="brand-en">STARBUCKS</div>
      <div class="brand-ko">스타벅스 코리아</div>
    </div>
    <div class="body">
      <div class="product">아메리카노</div>
      <div class="size">Tall (355ml)</div>
      <hr class="divider">
      <div class="expiry-label">유효기간</div>
      <div class="expiry-value">2027.06.30</div>
      <div class="barcode-wrap">
        <svg id="barcode"></svg>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>
  <script>
    JsBarcode("#barcode", "9000123456789", {
      format: "CODE128",
      lineColor: "#000",
      background: "#fff",
      width: 2,
      height: 70,
      displayValue: true,
      fontSize: 13,
      margin: 8
    });
  </script>
</body>
</html>
